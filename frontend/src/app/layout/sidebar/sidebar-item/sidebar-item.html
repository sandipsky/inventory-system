@if (hasChildren()) {
  <div
    class="item"
    role="button"
    tabindex="0"
    [class.active]="groupActive() && !expanded()"
    [class.open]="expanded()"
    [class.collapsed]="collapsed()"
    [attr.aria-expanded]="expanded()"
    [lTooltip]="collapsed() ? item().label : ''"
    lTooltipPlacement="right"
    (click)="toggle()"
    (keydown.enter)="toggle()"
  >
    <l-icon class="icon" [name]="item().icon" [size]="20" color="inherit" />
    <span class="label">{{ item().label }}</span>
    <l-icon class="caret" name="caret" [size]="14" color="inherit" />
  </div>

  @if (expanded()) {
    <ul class="children">
      @for (child of item().children; track child.route) {
        <li>
          <a
            class="item child"
            [class.collapsed]="collapsed()"
            [routerLink]="child.route"
            routerLinkActive="active"
            [lTooltip]="collapsed() ? child.label : ''"
            lTooltipPlacement="right"
          >
            @if (child.icon) {
              <l-icon class="icon" [name]="child.icon" [size]="18" color="inherit" />
            } @else {
              <span class="initial">{{ child.label.charAt(0) }}</span>
            }
            <span class="label">{{ child.label }}</span>
          </a>
        </li>
      }
    </ul>
  }
} @else {
  <a
    class="item"
    [class.collapsed]="collapsed()"
    [routerLink]="item().route"
    routerLinkActive="active"
    [lTooltip]="collapsed() ? item().label : ''"
    lTooltipPlacement="right"
  >
    <l-icon class="icon" [name]="item().icon" [size]="20" color="inherit" />
    <span class="label">{{ item().label }}</span>
  </a>
}
