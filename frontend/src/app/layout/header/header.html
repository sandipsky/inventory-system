<header class="header">
    <l-breadcrumb class="breadcrumb" [title]="title()" [items]="crumbs()" />

    <div class="actions">
        <l-button class="action" variant="ghost" size="md" [rounded]="true" aria-label="Calculator" (click)="openCalculator()">
            <l-icon name="calculator" [size]="20" color="inherit" />
        </l-button>

        <app-notification-menu />

        @if (canRangePrint()) {
            <l-button
                class="action"
                variant="ghost"
                size="md"
                [rounded]="true"
                aria-label="Range print"
                (click)="openRangePrint()"
            >
                <l-icon name="printer" [size]="20" color="inherit" />
            </l-button>
        }

        <app-profile-menu class="profile" />
    </div>
</header>
