<app-list-page-card>
    <app-list-card-title>
        <l-filter
            class="filter"
            searchBy="fullName"
            [filterColumns]="filterColumns()"
            (filterChange)="onFilterChange($event)"
        />

        @if (canCreate()) {
            <l-button card-actions class="action" variant="primary" (click)="openForm('add')">
                <l-icon name="add" [size]="18" color="inherit" />
                Add User
            </l-button>
        }
    </app-list-card-title>

    <app-list-card-body>
        <l-table
            class="table"
            rowKey="id"
            [columns]="columns"
            [data]="rows()"
            [loading]="loading()"
            [emptyText]="emptyText()"
            [serverSort]="true"
            [(sort)]="sort"
            (sortChange)="resetPage()"
        >
            <ng-template lTableCell="sn" let-index="index">{{ serial(index) }}</ng-template>

            <ng-template lTableCell="full_name" let-row>
                <div class="person">
                    <app-user-avatar [path]="row.image_url" [name]="row.full_name" size="32px" />
                    <div class="stack">
                        <l-button class="link" variant="ghost" size="sm" (click)="openForm('view', row.id)">{{ row.full_name }}</l-button>
                        <div class="meta">
                            <span class="muted">{{ row.username }}</span>
                            @if (isSelf(row)) {
                                <l-chip size="sm" variant="info">You</l-chip>
                            }
                        </div>
                    </div>
                </div>
            </ng-template>

            <ng-template lTableCell="contact" let-row>{{ row.contact || '-' }}</ng-template>
            <ng-template lTableCell="role_name" let-row>{{ row.role_name || 'No role' }}</ng-template>

            <ng-template lTableCell="is_active" let-row>
                <l-chip size="sm" [dot]="true" [variant]="row.is_active ? 'success' : 'default'">
                    {{ row.is_active ? 'ACTIVE' : 'INACTIVE' }}
                </l-chip>
            </ng-template>

            <ng-template lTableCell="actions" let-row>
                <l-menu class="row-menu" mode="right">
                    <l-button dropdown-display class="more" variant="outlined" size="sm" [attr.aria-label]="'Actions for ' + row.full_name">
                        <l-icon name="more" [size]="16" color="inherit" />
                    </l-button>

                    <div dropdown-item class="menu-item" (click)="openForm('view', row.id)">
                        <l-icon name="eye" [size]="16" color="inherit" />
                        View
                    </div>
                    @if (canEdit()) {
                        <div dropdown-item class="menu-item" (click)="openForm('edit', row.id)">
                            <l-icon name="edit" [size]="16" color="inherit" />
                            Edit
                        </div>
                    }
                    @if (canDeleteRow(row)) {
                        <div dropdown-item class="menu-item danger" (click)="remove(row)">
                            <l-icon name="trash" [size]="16" color="inherit" />
                            Delete
                        </div>
                    }
                </l-menu>
            </ng-template>
        </l-table>
    </app-list-card-body>

    <app-list-card-footer>
        <l-pagination [length]="total()" [(pageIndex)]="pageIndex" [(pageSize)]="pageSize" />
    </app-list-card-footer>
</app-list-page-card>
