<l-card padding="md">
    <div class="toolbar">
        <div class="left">
            <l-filter
                class="filter"
                searchBy="search"
                [filterColumns]="filterColumns"
                (filterChange)="onFilterChange($event)"
            />

            <l-segmented-control
                class="calendar"
                size="md"
                name="calendar"
                aria-label="Calendar system"
                [options]="calendarOptions"
                [(ngModel)]="calendar"
            />

            <l-date-input
                class="date"
                aria-label="From date"
                placeholder="From"
                format="YYYY/MM/DD"
                [calendar]="calendar()"
                [clearable]="false"
                [max]="toDate()"
                [(ngModel)]="fromDate"
            />

            <l-date-input
                class="date"
                aria-label="To date"
                placeholder="To"
                format="YYYY/MM/DD"
                [calendar]="calendar()"
                [clearable]="false"
                [min]="fromDate()"
                [(ngModel)]="toDate"
            />
        </div>

        <div class="right">
            <l-button class="action" variant="outlined" (click)="print()">
                <l-icon name="printer" [size]="18" color="inherit" />
                Print
            </l-button>

            <l-button class="action" variant="outlined" (click)="exportList()">
                <l-icon name="download" [size]="18" color="inherit" />
                Export
            </l-button>

            <l-button class="action" variant="primary" routerLink="new">
                <l-icon name="add" [size]="18" color="inherit" />
                Add Purchase Entry
            </l-button>
        </div>
    </div>
</l-card>
