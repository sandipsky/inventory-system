<div class="form-drawer">
    <header class="head">
        <div class="heading">
            <span class="badge" aria-hidden="true">
                <l-icon name="add" [size]="18" color="inherit" />
            </span>
            <div class="text">
                <h2 class="title">Add Opening Stock</h2>
                <p class="subtitle">Stock already on hand when you start using the system</p>
            </div>
        </div>

        <l-button class="close" variant="ghost" size="md" [rounded]="true" aria-label="Close" (click)="close()">
            <l-icon name="cross" [size]="20" color="inherit" />
        </l-button>
    </header>

    <form class="body" [formGroup]="form">
        <p class="note">
            <l-icon name="help" [size]="16" color="inherit" />
            <span>Each batch gets opening stock once. To change it later, use Stock Adjustment or Stock Edit.</span>
        </p>

        <l-select
            label="Product"
            placeholder="Select product"
            bindLabel="name"
            bindValue="id"
            [items]="productOptions()"
            [searchable]="true"
            formControlName="product_id"
            (change)="onProductChange($event)"
        />

        <div class="field">
            <div class="row">
                <l-text-input label="Batch No." placeholder="e.g. B1" formControlName="batch_no" />
                <l-date-input
                    label="Expiry Date"
                    placeholder="YYYY/MM/DD"
                    format="YYYY/MM/DD"
                    [calendar]="calendar"
                    [clearable]="true"
                    formControlName="expiry_date"
                />
            </div>
            <p class="hint">Leave the batch blank for the product's default batch.</p>
        </div>

        <div class="row">
            <l-number-input label="Quantity" placeholder="0" [decimalPlaces]="3" formControlName="quantity" />
            <l-number-input label="Cost Price" placeholder="0.00" [decimalPlaces]="2" formControlName="cost_price" />
        </div>

        <div class="row">
            <l-number-input label="Selling Price" placeholder="0.00" [decimalPlaces]="2" formControlName="selling_price" />
            <l-number-input label="MRP" placeholder="0.00" [decimalPlaces]="2" formControlName="mrp" />
        </div>
    </form>

    <footer class="foot">
        <l-button variant="outlined" (click)="close()">Cancel</l-button>
        <l-button variant="primary" [disabled]="saving()" (click)="save()">
            {{ saving() ? 'Saving…' : 'Add' }}
        </l-button>
    </footer>
</div>
