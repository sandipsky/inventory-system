spring.datasource.url=jdbc:sqlite:inventory_system.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite ignores foreign keys unless each connection turns them on. Set here, not in the URL,
# so it also applies where SPRING_DATASOURCE_URL replaces the URL (Docker)
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in millisecond
jwt.expiration=3600000
auth.maxFailedAttempts=5
auth.lockTimeDurationMs=3600000
# auth.lockTimeDurationMs=2000

file.upload-dir=uploads/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
